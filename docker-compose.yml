# Optional isolated sandbox only. Daily development uses native PostgreSQL coast_v17 on 5432.
services:
  db:
    profiles: ["isolated"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coast_v17
      POSTGRES_USER: coast
      POSTGRES_PASSWORD: coast
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Applies the schema only when Postgres initializes a fresh data volume.
      - ./migrations/000001_init.sql:/docker-entrypoint-initdb.d/000001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coast -d coast_v17"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["isolated"]
    build:
      context: .
    environment:
      DATABASE_URL: postgres://coast:coast@db:5432/coast_v17?sslmode=disable
      SESSION_SECRET: local-development-session-secret-32
      HTTP_ADDR: :8090
      SECURE_COOKIES: "false"
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
