<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動代碼管理</title><link rel="stylesheet" href="/styles.css"><style>body{padding:24px}main{max-width:900px;margin:auto}.activity-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:8px;margin:12px 0}input,select,button{font:inherit;padding:10px}select{min-height:160px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border:1px solid #abc3be}#new-code{overflow-wrap:anywhere;font-size:22px;background:#fff2d4;padding:16px}#status{color:#a43f2d}section{margin:24px 0}@media(max-width:600px){.activity-fields{grid-template-columns:1fr}}</style><script type="module" src="/reef-activities.js"></script></head>
<body><main><a href="/">← 返回管理後台</a><h1>活動代碼管理</h1><p>設定允許的樣點與日期；志工使用代碼進入活動範圍。新代碼只在建立或重新產生時顯示。</p><p id="status" role="status"></p><section id="workspace" hidden><form id="activity-form"><label>活動名稱<input name="name" required maxlength="120"></label><div class="activity-fields"><label>開始日期<input type="date" name="start_date" required></label><label>結束日期<input type="date" name="end_date" required></label></div><label>允許的樣點<select name="sites" multiple required aria-describedby="sites-help"></select><small id="sites-help">可選多個樣點；桌面按住 Command／Ctrl 複選。</small></label><label>代碼失效時間（選填）<input type="datetime-local" name="expires_at"></label><button class="primary-button" type="submit">建立活動與代碼</button></form><p id="new-code" hidden></p></section><section><h2>既有活動</h2><div id="activity-list"></div></section></main></body></html>
