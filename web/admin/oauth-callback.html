<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>登入中… · Coast Monitoring Admin</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .callback-card {
        width: min(620px, 100%);
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        background: var(--bg-card);
        box-shadow: var(--shadow);
      }

      .callback-card h1 {
        margin: 6px 0 10px;
        font-family: var(--font-display);
        font-size: 22px;
        font-weight: 700;
      }

      .callback-card p {
        color: var(--fg-muted);
        line-height: 1.6;
      }

      .callback-error {
        color: var(--danger);
        margin-top: 14px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main class="callback-card">
      <p class="eyebrow">EIC Coast · Admin</p>
      <h1>正在登入</h1>
      <p id="status">正在完成 Google 登入…</p>
      <p id="error" class="callback-error"></p>
    </main>

    <script type="module">
      const status = document.querySelector("#status")
      const error = document.querySelector("#error")

      function showError(message) {
        status.textContent = "登入失敗。"
        error.textContent = message
      }

      try {
        status.textContent = "正在跳轉…"
        window.location.replace("/")
      } catch (err) {
        showError(err?.message || "發生未預期的錯誤。")
      }
    </script>
  </body>
</html>
