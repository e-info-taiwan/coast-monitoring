<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Signing in...</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .callback-card {
        width: min(620px, 100%);
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .callback-card p {
        color: var(--muted);
        line-height: 1.6;
      }

      .callback-error {
        color: #ffd9d9;
        margin-top: 14px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main class="callback-card">
      <p class="eyebrow">OAuth callback</p>
      <h1>Signing in</h1>
      <p id="status">Finishing Google login...</p>
      <p id="error" class="callback-error"></p>
    </main>

    <script type="module">
      const API_BASE = `${window.location.origin}/api`
      const AUTH_STORAGE_KEY = "coast-monitoring-auth"
      const OAUTH_STORAGE_KEY = "coast-monitoring-oauth-provider"

      const status = document.querySelector("#status")
      const error = document.querySelector("#error")

      function showError(message) {
        status.textContent = "Sign in failed."
        error.textContent = message
      }

      function safeParse(json) {
        try {
          return JSON.parse(json)
        } catch (_) {
          return null
        }
      }

      const url = new URL(window.location.href)
      const code = url.searchParams.get("code")
      const returnedState = url.searchParams.get("state")
      const stored = safeParse(localStorage.getItem(OAUTH_STORAGE_KEY) || "null")

      if (!code || !returnedState) {
        showError("Missing OAuth code or state.")
      } else if (!stored) {
        showError("Missing stored provider data. Please restart sign-in from the home page.")
      } else if (stored.state && stored.state !== returnedState) {
        showError("OAuth state mismatch.")
      } else {
        try {
          const response = await fetch(`${API_BASE}/collections/users/auth-with-oauth2`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({
              provider: stored.name,
              code,
              codeVerifier: stored.codeVerifier,
              redirectUrl: `${window.location.origin}/oauth-callback.html`,
            }),
          })

          const text = await response.text()
          const data = text ? JSON.parse(text) : null

          if (!response.ok) {
            throw new Error(data?.message || `Auth exchange failed (${response.status})`)
          }

          localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(data))
          localStorage.removeItem(OAUTH_STORAGE_KEY)
          status.textContent = "Signed in. Redirecting..."
          window.location.replace("/")
        } catch (err) {
          showError(err?.message || "Something went wrong.")
        }
      }
    </script>
  </body>
</html>
